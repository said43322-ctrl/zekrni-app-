name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract project zip
        run: |
          mkdir -p project
          unzip -o Zekrni_Android_Project_Navy_Complete.zip -d project

      - name: Remove placeholder file from res raw
        run: rm -f project/android/app/src/main/res/raw/README_ADD_ADHAN_SOUND.txt

      - name: Fix Kotlin version conflict
        run: |
          cat >> project/android/build.gradle << 'EOF'

          allprojects {
              afterEvaluate { proj ->
                  proj.configurations.all {
                      resolutionStrategy {
                          force 'org.jetbrains.kotlin:kotlin-stdlib:1.9.24'
                          force 'org.jetbrains.kotlin:kotlin-stdlib-common:1.9.24'
                      }
                      exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
                      exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
                  }
              }
          }
          EOF
          echo "----- CONTENT AFTER EDIT -----"
          tail -n 20 project/android/build.gradle

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        working-directory: project
        run: |
          npm install --legacy-peer-deps
          npm install @capacitor/android@latest --legacy-peer-deps

      - name: Build web assets
        working-directory: project
        run: npm run build --if-present

      - name: Sync Capacitor Android
        working-directory: project
        run: npx cap sync android

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Generate Gradle Wrapper
        working-directory: project/android
        run: gradle wrapper --gradle-version 8.11.1

      - name: Grant execute permission for gradlew
        working-directory: project/android
        run: chmod +x gradlew

      - name: Build debug APK
        working-directory: project/android
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Zekrni-APK
          path: project/android/app/build/outputs/apk/debug/app-debug.apk
